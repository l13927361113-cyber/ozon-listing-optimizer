{% extends "base.html" %}{% block content %}
<div id="libraryListView">
<h1>文案库</h1><p class="muted">按零件号、型号、标题或记录编号查找。每页最多10条，点击查看只显示当前商品。</p>
<div class="library-controls"><input id="librarySearch" type="search" placeholder="搜索零件号（如629851-8）、型号、俄文标题或记录编号" aria-label="搜索文案"><select id="libraryFilter" aria-label="修订状态"><option value="all">全部文案</option><option value="revised">已修订</option><option value="unrevised">未修订</option></select></div>
<div class="library-table"><div class="library-row library-header"><span>编号 / 时间</span><span>零件号</span><span>商品标题</span><span>状态 / 操作</span></div>
{% for x in listings %}<div class="library-row library-record" data-id="{{x.id}}" data-title="{{x.title|e}}" data-model="{{x.model|e}}" data-input='{{(x.input_data or "{}")|e}}' data-output='{{(x.output_data or "{}")|e}}'>
<div><strong>#{{x.id}}</strong><small class="muted">{{x.created_at.strftime('%Y-%m-%d %H:%M')}}</small></div>
<div class="library-part" data-part="">识别中…</div>
<div class="library-title" title="{{x.title|e}}">{{x.title}}</div>
<div class="library-ops"><span class="revisionBadge" data-id="{{x.id}}" hidden>已修订</span><button type="button" class="viewListing library-action" data-id="{{x.id}}">查看</button><a class="library-action" href="/revise?id={{x.id}}">修订</a><button type="button" class="deleteListing library-action danger-outline" data-id="{{x.id}}">删除</button></div>
</div>{% else %}<div class="empty">暂无数据</div>{% endfor %}
<div class="empty hidden" id="libraryEmpty">没有找到匹配的文案</div></div>
<div class="library-pagination"><span id="libraryCount" class="muted"></span><div><button type="button" class="secondary" id="libraryPrev">上一页</button><span id="libraryPageInfo"></span><button type="button" class="secondary" id="libraryNext">下一页</button></div></div>
</div>
<div class="panel hidden" id="libraryDetail">
<div class="library-detail-nav"><button type="button" class="library-back" data-back-library><span aria-hidden="true">←</span> 返回文案库</button></div>
<div class="library-head"><div><h2 id="detailTitle">文案详情</h2><p id="detailMeta" class="muted"></p></div><button class="secondary" id="copyLibrary">复制完整 JSON</button></div>
<div id="librarySections"></div><details class="raw-details"><summary>查看原始 JSON（高级）</summary><pre id="libraryOutput"></pre></details>
<div class="library-detail-nav"><button type="button" class="library-back" data-back-library><span aria-hidden="true">←</span> 返回文案库</button></div>
</div>
{% endblock %}
