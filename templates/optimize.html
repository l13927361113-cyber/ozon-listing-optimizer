{% extends "base.html" %}{% block content %}
<h1>旧商品优化</h1><div class="panel">
<label>商品类型 / 品牌 / 型号（可选）</label><input id="meta">
<label>品牌生成策略</label><div class="seg"><button id="withBrand" class="active">带品牌</button><button id="noBrand">不带品牌</button></div>
<label>原商品标题（必填，其他资料均可留空）</label><textarea id="oldTitle" rows="3"></textarea>
<label>原 Product Description（Russian）</label><textarea id="oldDesc" rows="10"></textarea>
<label>原 Hashtags</label><textarea id="oldTags" rows="5"></textarea>
<label>其他资料 / 你想解决的问题</label><textarea id="notes" rows="5"></textarea>
<button id="oneClickBtn" class="primary">一键生成优化指令（免费 Plus 模式）</button><p class="muted">旧标题即可生成完整核验与优化指令；在 ChatGPT 中执行研究，完成后粘贴 JSON 保存。</p>
</div><details class="panel"><summary>可选：付费 API 全自动生成</summary><p class="muted">需要单独配置 OPENAI_API_KEY。</p><button id="apiGenerateBtn" class="secondary">API 自动生成（需单独付费）</button></details><div id="output" class="result hidden"></div>
<div class="panel" id="chatPanel" style="margin-top:18px"><h2>ChatGPT Plus 辅助模式（无需 API Key）</h2><p>只需复制一次完整指令到 ChatGPT，完成后使用 ChatGPT JSON 代码框右上角“复制代码”，粘贴回来保存。不会自动调用 ChatGPT。</p><div class="actions"><button id="copyPromptBtn" class="primary">复制 ChatGPT 指令</button><button id="openChatBtn" class="secondary">打开 ChatGPT</button></div><label>指令预览</label><textarea id="promptPreview" rows="7" readonly placeholder="点击生成指令后显示"></textarea><label>粘贴 ChatGPT 回答</label><textarea id="importText" rows="12" placeholder="将 ChatGPT 的完整回答粘贴到这里"></textarea><button id="importBtn" class="primary">保存到文案库</button><div id="importStatus"></div></div>
{% endblock %}
